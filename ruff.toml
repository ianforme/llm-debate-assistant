# Exclude a variety of commonly ignored directories.
exclude = [
    ".git",
    ".venv",
    "__pycache__",
]

line-length = 100  # Accommodate absolute import paths

[lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = ["E", "F", "W"]
ignore = []

# Ignore E501 (line too long) in prompt files since they contain long Chinese text
[lint.per-file-ignores]
"src/llm_debate_assistant/prompts/*.py" = ["E501"]
"src/llm_debate_assistant/utils/style_cards.py" = ["E501"]
"src/llm_debate_assistant/utils/helpers.py" = ["E501"]
"src/llm_debate_assistant/core/*.py" = ["E501"]
"src/llm_debate_assistant/agents/**/*.py" = ["E501"]  # Long absolute imports after refactoring
